<!DOCTYPE html>
<html>
    <head>
        <title>Event World</title>
        <style>
            .contents{
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                border: 2px solid black;
                padding: 15px;
            }

            #generateButton{
                margin-top: 5px;
                margin-bottom: 5px;
            }
        </style>
    </head>
    <body onload="welcome()">
        <div class="contents">
            <h3 id="caption">Silahkan tekan salah satu tombol di bawah...</h3>
            <button id="incrementButton" onclick="increment()">Tekan Aku :)</button>
            <h3>Kamu sudah menekan tombol di atas sebanyak: <span id="count">0</span> kali.</h3>
            <button class="button" id="customButton">Jangan Tekan Aku?</button>
        </div>

        <script>
            function welcome(){
                alert('Sim salabim muncullah elemen-elemen HTML!');
                const contents = document.querySelector('.contents');
                contents.removeAttribute('hidden');
            }

            function increment(){
                document.getElementById('count').innerText++;

                if(document.getElementById('count').innerText == 7){
                    const hiddenMessage = document.createElement('h4');
                    hiddenMessage.innerText = 'Selamat! Anda menemukan hadiah tersembunyi...';

                    const image = document.createElement('img');
                    image.setAttribute('src', 'https://raw.githubusercontent.com/dicodingacademy/a315-web-pemula-labs/shared-files/catto.jpg');
                    
                    const contents = document.querySelector('.contents');
                    contents.appendChild(hiddenMessage).appendChild(image);
                }
            }

            const changeCaption = new Event('changeCaption');

            window.addEventListener('load', function(){
                const button = document.getElementById('customButton');
                button.addEventListener('changeCaption', customEventHandler);
                button.addEventListener('click', function(){
                    button.dispatchEvent(changeCaption);
                });
            })

            function customEventHandler(ev){
                console.log('Event ' + ev.type + ' telah dijalankan');
                const caption = document.getElementById('caption');
                caption.innerText = 'Oh, kamu tekan aku!';
            }
            
        </script>
    </body>
    
</html>
